<!doctype html>
<html lang="it">
  <head>
    <meta charset="UTF-8" />
    <title>Tabellone Hockey</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        background: #050d18;
        color: #e8f1fb;
        font-family: 'Segoe UI', system-ui, sans-serif;
        user-select: none;
        -webkit-app-region: drag;
      }
      main {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 14px;
        height: 100%;
        border: 1px solid #12304f;
        box-sizing: border-box;
      }
      svg.logo {
        width: 96px;
        height: 96px;
      }
      h1 {
        margin: 0;
        font-size: 22px;
        font-weight: 700;
        letter-spacing: 0.02em;
      }
      p {
        margin: 0;
        font-size: 14px;
        color: #9cc3ea;
      }
      .bar {
        position: relative;
        width: 200px;
        height: 4px;
        overflow: hidden;
        border-radius: 2px;
        background: #12304f;
      }
      .bar::after {
        content: '';
        position: absolute;
        inset: 0 auto 0 0;
        width: 40%;
        border-radius: 2px;
        background: #9cc3ea;
        animation: slide 1.1s ease-in-out infinite;
      }
      @keyframes slide {
        from {
          transform: translateX(-100%);
        }
        to {
          transform: translateX(250%);
        }
      }
    </style>
  </head>
  <body>
    <main>
      <svg class="logo" viewBox="0 0 512 512" aria-hidden="true">
        <defs>
          <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0" stop-color="#14365c" />
            <stop offset="1" stop-color="#050d18" />
          </linearGradient>
        </defs>
        <rect x="16" y="16" width="480" height="480" rx="104" fill="url(#bg)" />
        <rect
          x="16"
          y="16"
          width="480"
          height="480"
          rx="104"
          fill="none"
          stroke="#2c6aa3"
          stroke-width="8"
        />
        <circle cx="256" cy="240" r="168" fill="none" stroke="#12304f" stroke-width="30" />
        <path
          d="M256 72 A168 168 0 1 1 88 240"
          fill="none"
          stroke="#9cc3ea"
          stroke-width="30"
          stroke-linecap="round"
        />
        <ellipse cx="256" cy="290" rx="112" ry="40" fill="#0a0e14" />
        <rect x="144" y="230" width="224" height="60" fill="#0a0e14" />
        <ellipse cx="256" cy="230" rx="112" ry="40" fill="#2a3442" />
        <circle cx="256" cy="414" r="26" fill="#ff3b3b" />
      </svg>
      <h1>Tabellone Hockey</h1>
      <div class="bar"></div>
      <p>Avvio in corso…</p>
    </main>
  </body>
</html>
