<!doctype html>
<html lang="it">
  <head>
    <meta charset="UTF-8" />
    <title>Tabellone Hockey</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        background: #050d18;
        color: #e8f1fb;
        font-family: 'Segoe UI', system-ui, sans-serif;
        user-select: none;
        -webkit-app-region: drag;
      }
      main {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 14px;
        height: 100%;
        border: 1px solid #12304f;
        box-sizing: border-box;
      }
      svg.logo {
        width: 96px;
        height: 96px;
      }
      h1 {
        margin: 0;
        font-size: 22px;
        font-weight: 700;
        letter-spacing: 0.02em;
      }
      p {
        margin: 0;
        font-size: 14px;
        color: #9cc3ea;
      }
      .bar {
        position: relative;
        width: 200px;
        height: 4px;
        overflow: hidden;
        border-radius: 2px;
        background: #12304f;
      }
      .bar::after {
        content: '';
        position: absolute;
        inset: 0 auto 0 0;
        width: 40%;
        border-radius: 2px;
        background: #9cc3ea;
        animation: slide 1.1s ease-in-out infinite;
      }
      @keyframes slide {
        from {
          transform: translateX(-100%);
        }
        to {
          transform: translateX(250%);
        }
      }
    </style>
  </head>
  <body>
    <main>
      <svg class="logo" viewBox="0 0 512 512" aria-hidden="true">
        <defs>
          <clipPath id="sq"><rect x="16" y="16" width="480" height="480" rx="104" /></clipPath>
          <radialGradient id="puck" cx="0.4" cy="0.35" r="0.75">
            <stop offset="0" stop-color="#3a4656" />
            <stop offset="1" stop-color="#07090d" />
          </radialGradient>
        </defs>
        <g clip-path="url(#sq)">
          <rect x="0" y="0" width="512" height="512" fill="#1f6feb" />
          <path d="M0 0 H330 L182 512 H0 Z" fill="#d62839" />
          <path d="M330 0 L182 512" stroke="#ffffff" stroke-width="14" />
        </g>
        <circle cx="256" cy="256" r="150" fill="#000" opacity="0.3" transform="translate(0 10)" />
        <circle cx="256" cy="256" r="150" fill="url(#puck)" />
        <circle cx="256" cy="256" r="150" fill="none" stroke="#56657a" stroke-width="6" />
        <circle
          cx="256"
          cy="256"
          r="128"
          fill="none"
          stroke="#56657a"
          stroke-width="3"
          stroke-dasharray="6 10"
        />
        <text
          x="256"
          y="300"
          text-anchor="middle"
          font-family="Arial Black, Arial, sans-serif"
          font-weight="900"
          font-size="128"
          fill="#ffffff"
          letter-spacing="2"
        >
          VS
        </text>
      </svg>
      <h1>Tabellone Hockey</h1>
      <div class="bar"></div>
      <p>Avvio in corso…</p>
    </main>
  </body>
</html>
